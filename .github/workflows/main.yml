name: LLVM Toolchain

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 3'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Actions
    steps:
      - name: Download scripts
        uses: actions/checkout@v3

      - name: Get deps
        run: ./ci.sh deps

      - name: Deploy builder
        env:
          LLVM_NAME: ${{ secrets.LLVM_NAME }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GL_USERNAME: ${{ secrets.GL_USERNAME }}
          GL_EMAIL: ${{ secrets.GL_EMAIL }}
          GL_TOKEN: ${{ secrets.GL_TOKEN }}
          GL_PUSH_REPO_URL: ${{ secrets.GL_PUSH_REPO_URL }}
        run: ./build-tc.sh
